name: secret-scan

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: a secret can be introduced in one commit and removed
          # in the next, leaving the branch tip clean while the object remains
          # reachable. Scanning only the diff would miss that entirely.
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Fail the run on a finding instead of only annotating the PR.
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
